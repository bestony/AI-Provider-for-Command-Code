name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches plugin version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 '^ \* Version:' ai-provider-for-command-code.php | awk '{print $3}')
          stable=$(grep -m1 '^Stable tag:' readme.txt | awk '{print $3}')
          if [ "$tag" != "$header" ] || [ "$tag" != "$stable" ]; then
            echo "tag $tag != header $header / stable tag $stable" >&2
            exit 1
          fi

      - name: Build plugin zip
        run: |
          set -euo pipefail
          slug=ai-provider-for-command-code
          zip="build/$slug-${GITHUB_REF_NAME}.zip"
          mkdir -p build
          git archive --format=zip --prefix="$slug/" -o "$zip" HEAD
          unzip -l "$zip" | grep -q "$slug/$slug.php"

      - name: Compose release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          {
            awk -v v="$version" '$0 == "= " v " =" {found=1; next} found && /^= / {exit} found' readme.txt
            echo
            echo "**Commits**"
            prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              git log --pretty='- %s (%h)' "$prev..$GITHUB_REF_NAME"
            else
              git log --pretty='- %s (%h)' "$GITHUB_REF_NAME"
            fi
          } > RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
