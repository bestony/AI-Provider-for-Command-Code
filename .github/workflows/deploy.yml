name: Deploy to WordPress.org

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag, plugin header, stable tag, config constant and changelog agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 '^ \* Version:' ai-provider-for-command-code.php | awk '{print $3}')
          stable=$(grep -m1 '^Stable tag:' readme.txt | awk '{print $3}')
          # The User-Agent is built from this constant, so it drifts silently if it is not checked.
          config=$(perl -ne "print \$1 if /const VERSION = '([\d.]+)'/" src/Util/CommandCodeConfig.php)
          for pair in "header:$header" "stable tag:$stable" "config VERSION:$config"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ "$tag" != "$value" ]; then
              echo "tag $tag != $name $value" >&2
              exit 1
            fi
          done
          # A release with no changelog entry publishes empty release notes, so fail instead.
          if ! grep -qx "= ${tag} =" readme.txt; then
            echo "readme.txt has no '= ${tag} =' changelog entry" >&2
            exit 1
          fi

      - name: Verify the plugin's own self-check passes
        run: |
          set -euo pipefail
          # No --sdk: the SDK is not vendored, so only the WordPress-free checks can run here.
          php scripts/selfcheck.php

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ai-provider-for-command-code
          ASSETS_DIR: .wordpress-org
